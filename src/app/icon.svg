    <!-- Cow spots -->
    <path d="M27 21 C32 19.5 37 20.5 39 23 C37 26.5 31 27.5 27 25.5 C25.5 24 25.5 22 27 21 Z" fill="#1c222b"/>
    <path d="M43 26 C47 25 50 27 51 30 C49 33 45 33.5 42 31.5 C41 29 41 27 43 26 Z" fill="#1c222b"/>
    <path d="M31 34.5 C35 33 39 34 40 36.5 C39 40 34 41 31 39 C29.5 37.5 29.5 35.5 31 34.5 Z" fill="#1c222b"/>
    <path d="M20 29 C23 27.5 26 28.5 27 30.5 C26 33 22 33.5 20 31.5 C19 30.5 19 29.5 20 29 Z" fill="#1c222b"/>
    <path d="M22 37.5 C25 36.5 27 37.5 28 39.5 C27 41.5 24 42 22 40.5 C21 39.5 21 38.5 22 37.5 Z" fill="#1c222b"/>
    <!-- Small finlets near tail -->
    <path d="M46 22 L49 19 L49.5 23 Z" fill="#3a4756"/>
    <path d="M46 42 L49 45 L49.5 41 Z" fill="#3a4756"/>
    <!-- Eye -->
    <circle cx="9.5" cy="30" r="2.4" fill="#ffffff"/>
    <circle cx="9.5" cy="30" r="1.4" fill="#10151c"/>
